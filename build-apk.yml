name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/ir/nobitex/trader
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "NobitexTrader"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'ir.nobitex.trader'
              compileSdk 35

              defaultConfig {
                  applicationId 'ir.nobitex.trader'
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName '1.0.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="Nobitex Trader"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Nobitex Trader</string>
          </resources>
          EOF

          cat > app/src/main/java/ir/nobitex/trader/MainActivity.java <<'EOF'
          package ir.nobitex.trader;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Typeface;
          import android.view.Gravity;
          import android.widget.*;

          public class MainActivity extends Activity {

              TextView status;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(40, 50, 40, 40);
                  root.setGravity(Gravity.CENTER_HORIZONTAL);

                  TextView title = new TextView(this);
                  title.setText("Nobitex Trader");
                  title.setTextSize(28);
                  title.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  root.addView(title);

                  TextView info = new TextView(this);
                  info.setText("\\nربات معامله‌گر نوبیتکس\\n\\nنسخه اولیه — Paper Trading");
                  info.setTextSize(18);
                  root.addView(info);

                  status = new TextView(this);
                  status.setText("\\nوضعیت: متوقف");
                  status.setTextSize(18);
                  root.addView(status);

                  Button start = new Button(this);
                  start.setText("شروع ربات");
                  start.setOnClickListener(v ->
                      status.setText("وضعیت: در حال اجرا — Paper")
                  );
                  root.addView(start);

                  Button stop = new Button(this);
                  stop.setText("توقف");
                  stop.setOnClickListener(v ->
                      status.setText("وضعیت: متوقف")
                  );
                  root.addView(stop);

                  Button emergency = new Button(this);
                  emergency.setText("توقف اضطراری");
                  emergency.setOnClickListener(v ->
                      status.setText("وضعیت: توقف اضطراری")
                  );
                  root.addView(emergency);

                  TextView warning = new TextView(this);
                  warning.setText("\\n⚠️ کلید API نوبیتکس را داخل برنامه یا GitHub قرار ندهید.");
                  warning.setTextSize(14);
                  root.addView(warning);

                  setContentView(root);
              }
          }
          EOF

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nobitex-trader-apk
          path: app/build/outputs/apk/debug/app-debug.apk
