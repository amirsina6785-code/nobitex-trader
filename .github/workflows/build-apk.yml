name: Build Nobitex Trader APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/nobitextrader
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "NobitexTrader"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '9.4.0' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.nobitextrader'
              compileSdk 37

              defaultConfig {
                  applicationId 'com.nobitextrader'
                  minSdk 26
                  targetSdk 37
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="false"
                  android:label="Nobitex Trader"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:padding">16dp</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/nobitextrader/MainActivity.java <<'EOF'
          package com.nobitextrader;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.*;

          public class MainActivity extends Activity {

              LinearLayout root;
              EditText serverUrl;
              EditText controlKey;
              EditText allocation;
              TextView status;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(32,32,32,32);
                  root.setGravity(Gravity.TOP);

                  TextView title = new TextView(this);
                  title.setText("Nobitex Trader");
                  title.setTextSize(28);
                  title.setTextColor(Color.BLACK);
                  title.setPadding(0,0,0,30);
                  root.addView(title);

                  TextView info = new TextView(this);
                  info.setText("پنل کنترل ربات — Spot Only");
                  info.setTextSize(18);
                  root.addView(info);

                  serverUrl = field("Server URL");
                  root.addView(serverUrl);

                  controlKey = field("Control Key");
                  controlKey.setInputType(0x00000081);
                  root.addView(controlKey);

                  allocation = field("Allocation (RLS)");
                  allocation.setInputType(2);
                  root.addView(allocation);

                  Button sync = button("Sync Wallet");
                  root.addView(sync);

                  Button allocate = button("Allocate");
                  root.addView(allocate);

                  Button start = button("START BOT");
                  root.addView(start);

                  Button stop = button("STOP BOT");
                  root.addView(stop);

                  Button emergency = button("EMERGENCY STOP");
                  root.addView(emergency);

                  status = new TextView(this);
                  status.setText("Status: Disconnected");
                  status.setTextSize(16);
                  status.setPadding(0,30,0,0);
                  root.addView(status);

                  sync.setOnClickListener(v ->
                      status.setText("Wallet sync requested"));

                  allocate.setOnClickListener(v ->
                      status.setText("Allocation requested"));

                  start.setOnClickListener(v ->
                      status.setText("Bot START requested"));

                  stop.setOnClickListener(v ->
                      status.setText("Bot STOP requested"));

                  emergency.setOnClickListener(v ->
                      status.setText("EMERGENCY STOP requested"));

                  setContentView(root);
              }

              EditText field(String hint) {
                  EditText e = new EditText(this);
                  e.setHint(hint);
                  e.setTextSize(16);
                  e.setSingleLine(true);
                  e.setPadding(10,10,10,10);
                  return e;
              }

              Button button(String text) {
                  Button b = new Button(this);
                  b.setText(text);
                  b.setTextSize(15);
                  return b;
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 9.6
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NobitexTrader-debug
          path: app/build/outputs/apk/debug/app-debug.apk
